<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YADHIYA POS &amp; Manajemen Toko v1.6</title>
  <style>
    :root {
      --bg: #f4f6fb;
      --surface: #ffffff;
      --surface-alt: #f8fafc;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #f0fdf4;
      --warning: #b45309;
      --warning-soft: #fffbeb;
      --danger: #b91c1c;
      --danger-soft: #fef2f2;
      --radius: 12px;
      --shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      min-height: 100vh;
    }

    .hidden {
      display: none !important;
    }

    /* Login Screen */
    .login-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 410px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .login-card h1 {
      font-size: 22px;
      margin-bottom: 4px;
    }

    .login-card p.subtitle {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }

    .input-control, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .input-control:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.12);
    }

    .password-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-box .input-control {
      padding-right: 44px;
    }

    .eye-btn {
      position: absolute;
      right: 8px;
      background: transparent;
      border: none;
      cursor: pointer;
      color: var(--muted);
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .eye-btn:hover {
      background: var(--surface-alt);
      color: var(--text);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      border-radius: 10px;
      border: 1px solid transparent;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      width: 100%;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-alt);
      color: var(--text);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
    }

    .btn-success {
      background: var(--success);
      color: #ffffff;
    }

    .btn-danger {
      background: var(--danger-soft);
      color: var(--danger);
      border-color: #fecaca;
    }

    .btn-sm {
      padding: 6px 10px;
      font-size: 12px;
      border-radius: 8px;
    }

    .alert-error {
      background: var(--danger-soft);
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    .alert-success {
      background: var(--success-soft);
      color: var(--success);
      border: 1px solid #bbf7d0;
      padding: 10px 12px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
    }

    /* App Layout */
    .app-shell {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 250px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 14px;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .sidebar-brand {
      padding: 4px 8px 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 14px;
    }

    .sidebar-brand h2 {
      font-size: 17px;
      font-weight: 800;
    }

    .sidebar-brand span {
      font-size: 12px;
      color: var(--muted);
    }

    .nav-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-btn {
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-btn:hover {
      background: var(--surface-alt);
    }

    .nav-btn.active {
      background: var(--primary-soft);
      color: var(--primary);
      font-weight: 700;
    }

    .user-box {
      border-top: 1px solid var(--border);
      padding-top: 14px;
    }

    .user-meta {
      font-size: 13px;
      margin-bottom: 10px;
    }

    .role-pill {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--primary-soft);
      color: var(--primary);
      margin-top: 4px;
    }

    .main-content {
      flex: 1;
      padding: 24px;
      max-width: 1280px;
      margin: 0 auto;
      width: 100%;
    }

    .mobile-header {
      display: none;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .page-header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 20px;
    }

    .page-header h1 {
      font-size: 22px;
    }

    .page-header p {
      font-size: 13px;
      color: var(--muted);
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 20px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card h3 {
      font-size: 16px;
      margin-bottom: 12px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--muted);
      font-weight: 600;
    }

    .stat-value {
      font-size: 22px;
      font-weight: 800;
      margin-top: 4px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      text-align: left;
      vertical-align: middle;
    }

    th {
      background: var(--surface-alt);
      font-weight: 700;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
    }

    .text-right {
      text-align: right;
    }

    .badge-ok {
      background: var(--success-soft);
      color: var(--success);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .badge-low {
      background: var(--warning-soft);
      color: var(--warning);
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .pos-layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 18px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .product-tile {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: var(--surface-alt);
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
    }

    .product-tile:hover {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .product-tile .pname {
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .product-tile .pprice {
      color: var(--primary);
      font-weight: 700;
      font-size: 13px;
    }

    .product-tile .pmeta {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 14px;
    }

    .summary-total {
      border-top: 2px solid var(--border);
      margin-top: 8px;
      padding-top: 10px;
      font-size: 17px;
      font-weight: 800;
    }

    .bom-item-row {
      display: grid;
      grid-template-columns: 2fr 1fr auto;
      gap: 8px;
      margin-bottom: 8px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .grid-3, .grid-2, .pos-layout {
        grid-template-columns: 1fr;
      }
      .mobile-header {
        display: flex;
      }
      .sidebar {
        position: fixed;
        left: -260px;
        top: 0;
        z-index: 30;
        transition: left 0.2s ease;
      }
      .sidebar.open {
        left: 0;
      }
      .main-content {
        padding: 16px;
      }
    }

    @media print {
      .sidebar, .mobile-header, .no-print {
        display: none !important;
      }
      body {
        background: #ffffff;
      }
      .card {
        box-shadow: none;
        border: 1px solid #cbd5e1;
      }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="login-wrapper">
    <div class="login-card">
      <div class="brand-badge">YADHIYA POS &bull; v1.6</div>
      <h1>Masuk Aplikasi</h1>
      <p class="subtitle">Silakan masukkan username dan kata sandi akun Anda.</p>

      <div id="loginError" class="alert-error hidden"></div>

      <form id="loginForm" autocomplete="off">
        <div class="form-group">
          <label for="loginUsername">Username</label>
          <input
            type="text"
            id="loginUsername"
            class="input-control"
            placeholder="Masukkan username"
            value=""
            required
          />
        </div>

        <div class="form-group">
          <label for="loginPassword">Kata Sandi</label>
          <div class="password-box">
            <input
              type="password"
              id="loginPassword"
              class="input-control"
              placeholder="Masukkan kata sandi"
              value=""
              required
            />
            <button
              type="button"
              id="togglePasswordBtn"
              class="eye-btn"
              aria-label="Tampilkan kata sandi"
              title="Tampilkan / sembunyikan kata sandi"
            >
              <svg id="eyeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary">Masuk</button>
      </form>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appShell" class="app-shell hidden">
    <aside id="sidebar" class="sidebar">
      <div>
        <div class="sidebar-brand">
          <h2>YADHIYA POS</h2>
          <span>Manajemen Toko &amp; Manufaktur v1.6</span>
        </div>
        <nav id="navList" class="nav-list"></nav>
      </div>

      <div class="user-box">
        <div class="user-meta">
          <div id="activeUserName" style="font-weight:700;"></div>
          <div id="activeUserRole" class="role-pill"></div>
        </div>
        <button type="button" id="logoutBtn" class="btn btn-secondary btn-sm" style="width:100%;">Keluar</button>
      </div>
    </aside>

    <div style="flex:1; display:flex; flex-direction:column; min-width:0;">
      <header class="mobile-header">
        <button type="button" id="menuToggleBtn" class="btn btn-secondary btn-sm">Menu</button>
        <strong>YADHIYA POS v1.6</strong>
        <button type="button" id="mobileLogoutBtn" class="btn btn-secondary btn-sm">Keluar</button>
      </header>

      <main id="mainView" class="main-content"></main>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "yadhiya_pos_v1_6_db";

    const ROLE_PERMISSIONS = {
      owner: ["dashboard", "pos", "manufacturing", "inventory", "accounting", "accounts"],
      kasir: ["pos", "manufacturing", "inventory"],
      accounting: ["dashboard", "manufacturing", "inventory", "accounting"]
    };

    const MENU_META = {
      dashboard: { label: "Dashboard", subtitle: "Ringkasan operasional & keuangan toko" },
      pos: { label: "Kasir (POS)", subtitle: "Transaksi penjualan barang & hasil manufaktur" },
      manufacturing: { label: "Manufaktur", subtitle: "Resep BOM (kertas, tinta, bahan) + biaya listrik & operasional" },
      inventory: { label: "Stok & Restock", subtitle: "Bahan baku, produk jadi, dan pencatatan kulakan" },
      accounting: { label: "Keuangan & Jurnal", subtitle: "Laba rugi, biaya listrik/operasional, dan jurnal umum" },
      accounts: { label: "Manajemen Akun", subtitle: "Kelola pengguna dan kata sandi (Owner)" }
    };

    function defaultDatabase() {
      return {
        users: [
          { id: "u-owner", name: "Pemilik Yadhiya", username: "owner", password: "123", role: "owner", active: true },
          { id: "u-kasir", name: "Kasir Toko", username: "kasir", password: "123", role: "kasir", active: true },
          { id: "u-acc", name: "Staf Accounting", username: "accounting", password: "123", role: "accounting", active: true }
        ],
        materials: [
          { id: "mat-hvs-a4", name: "Kertas HVS A4 (Lembar)", unit: "lembar", stock: 2500, minStock: 500, unitCost: 110, isSellable: false, sellPrice: 0 },
          { id: "mat-hvs-f4", name: "Kertas F4 Folio (Lembar)", unit: "lembar", stock: 1500, minStock: 300, unitCost: 130, isSellable: false, sellPrice: 0 },
          { id: "mat-tinta-bw", name: "Tinta Hitam / Toner (ml/unit)", unit: "unit", stock: 8000, minStock: 1000, unitCost: 25, isSellable: false, sellPrice: 0 },
          { id: "mat-tinta-clr", name: "Tinta Warna Cetak (unit)", unit: "unit", stock: 4000, minStock: 600, unitCost: 85, isSellable: false, sellPrice: 0 },
          { id: "mat-jilid", name: "Cover & Spiral Jilid (set)", unit: "set", stock: 120, minStock: 25, unitCost: 2200, isSellable: false, sellPrice: 0 },
          { id: "prd-pulpen", name: "Pulpen Standar", unit: "pcs", stock: 85, minStock: 20, unitCost: 1800, isSellable: true, sellPrice: 3000 },
          { id: "prd-air", name: "Air Mineral Botol 600ml", unit: "botol", stock: 48, minStock: 12, unitCost: 2300, isSellable: true, sellPrice: 4000 }
        ],
        bomRecipes: [
          {
            id: "bom-fc-bw",
            name: "Fotokopi / Cetak Hitam Putih (Per Lembar)",
            outputUnit: "lembar",
            defaultPrice: 500,
            electricityCostPerUnit: 65,
            operationalCostPerUnit: 35,
            items: [
              { materialId: "mat-hvs-a4", qty: 1 },
              { materialId: "mat-tinta-bw", qty: 1 }
            ]
          },
          {
            id: "bom-print-clr",
            name: "Cetak Dokumen Warna (Per Lembar)",
            outputUnit: "lembar",
            defaultPrice: 1500,
            electricityCostPerUnit: 110,
            operationalCostPerUnit: 60,
            items: [
              { materialId: "mat-hvs-a4", qty: 1 },
              { materialId: "mat-tinta-clr", qty: 2 }
            ]
          },
          {
            id: "bom-jilid",
            name: "Jilid Dokumen / Laporan (Per Buku)",
            outputUnit: "buku",
            defaultPrice: 7500,
            electricityCostPerUnit: 250,
            operationalCostPerUnit: 300,
            items: [
              { materialId: "mat-jilid", qty: 1 }
            ]
          }
        ],
        sales: [],
        expenses: [],
        journals: []
      };
    }

    function loadDb() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) {
        const seed = defaultDatabase();
        saveDb(seed);
        return seed;
      }
      try {
        return JSON.parse(raw);
      } catch (e) {
        const seed = defaultDatabase();
        saveDb(seed);
        return seed;
      }
    }

    function saveDb(data) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    let db = loadDb();
    let currentUser = null;
    let activeTab = "dashboard";
    let posCart = [];
    let draftBomItems = [{ materialId: "mat-hvs-a4", qty: 1 }];

    function formatRupiah(num) {
      return "Rp " + Number(num || 0).toLocaleString("id-ID");
    }

    function nowDateStr() {
      return new Date().toISOString().slice(0, 10);
    }

    function getMaterial(id) {
      return db.materials.find((m) => m.id === id);
    }

    function calculateBomUnitCost(recipe) {
      const materialCost = (recipe.items || []).reduce((sum, item) => {
        const mat = getMaterial(item.materialId);
        return sum + (mat ? Number(mat.unitCost) * Number(item.qty) : 0);
      }, 0);
      const elec = Number(recipe.electricityCostPerUnit || 0);
      const oper = Number(recipe.operationalCostPerUnit || 0);
      return {
        materialCost,
        electricityCost: elec,
        operationalCost: oper,
        totalUnitCost: materialCost + elec + oper
      };
    }

    function addJournalEntry(memo, lines) {
      db.journals.unshift({
        id: "jrn-" + Date.now() + "-" + Math.floor(Math.random() * 1000),
        date: nowDateStr(),
        memo,
        lines
      });
    }

    // Login & Password Toggle
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");
    const loginUsername = document.getElementById("loginUsername");
    const loginPassword = document.getElementById("loginPassword");
    const togglePasswordBtn = document.getElementById("togglePasswordBtn");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePasswordBtn.addEventListener("click", () => {
      const isHidden = loginPassword.type === "password";
      loginPassword.type = isHidden ? "text" : "password";
      togglePasswordBtn.setAttribute(
        "aria-label",
        isHidden ? "Sembunyikan kata sandi" : "Tampilkan kata sandi"
      );
      eyeIcon.innerHTML = isHidden
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    });

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      db = loadDb();
      const uname = loginUsername.value.trim().toLowerCase();
      const pwd = loginPassword.value;

      const found = db.users.find(
        (u) => u.username.toLowerCase() === uname && u.password === pwd && u.active !== false
      );

      if (!found) {
        loginError.textContent = "Username atau kata sandi tidak valid, atau akun tidak aktif.";
        loginError.classList.remove("hidden");
        return;
      }

      loginError.classList.add("hidden");
      currentUser = found;
      loginUsername.value = "";
      loginPassword.value = "";
      loginPassword.type = "password";

      const allowed = ROLE_PERMISSIONS[currentUser.role] || ["pos"];
      activeTab = allowed[0];
      posCart = [];

      document.getElementById("loginScreen").classList.add("hidden");
      document.getElementById("appShell").classList.remove("hidden");
      renderShell();
    });

    function logout() {
      currentUser = null;
      posCart = [];
      document.getElementById("appShell").classList.add("hidden");
      document.getElementById("loginScreen").classList.remove("hidden");
      document.getElementById("sidebar").classList.remove("open");
    }

    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("mobileLogoutBtn").addEventListener("click", logout);
    document.getElementById("menuToggleBtn").addEventListener("click", () => {
      document.getElementById("sidebar").classList.toggle("open");
    });

    function renderShell() {
      if (!currentUser) return;
      document.getElementById("activeUserName").textContent = currentUser.name;
      document.getElementById("activeUserRole").textContent = currentUser.role.toUpperCase();

      const allowedTabs = ROLE_PERMISSIONS[currentUser.role] || [];
      const navList = document.getElementById("navList");
      navList.innerHTML = "";

      allowedTabs.forEach((tabKey) => {
        const meta = MENU_META[tabKey];
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "nav-btn" + (activeTab === tabKey ? " active" : "");
        btn.textContent = meta.label;
        btn.addEventListener("click", () => {
          activeTab = tabKey;
          document.getElementById("sidebar").classList.remove("open");
          renderShell();
        });

    function computeFinancialSummary() {
      const revenue = db.sales.reduce((s, x) => s + Number(x.total || 0), 0);
      const cogs = db.sales.reduce((s, x) => s + Number(x.cogs || 0), 0);
      const mfgElec = db.sales.reduce((s, x) => s + Number(x.mfgElectricity || 0), 0);
      const mfgOper = db.sales.reduce((s, x) => s + Number(x.mfgOperational || 0), 0);
      const directOper = db.expenses.reduce((s, x) => s + Number(x.amount || 0), 0);
      const grossProfit = revenue - cogs;
      const netProfit = revenue - cogs - mfgElec - mfgOper - directOper;
      return { revenue, cogs, mfgElec, mfgOper, directOper, grossProfit, netProfit };
    }

    function executeManufacturingProduction(recipeId, qty, sellImmediately = false, salePricePerUnit = null) {
      const recipe = db.bomRecipes.find((r) => r.id === recipeId);
      if (!recipe) return { ok: false, message: "Resep manufaktur tidak ditemukan." };
      const count = Number(qty);
      if (!count || count <= 0) return { ok: false, message: "Jumlah produksi harus lebih dari 0." };

      for (const item of recipe.items || []) {
        const mat = getMaterial(item.materialId);
        const needed = Number(item.qty) * count;
        if (!mat || Number(mat.stock) < needed) {
          return {
            ok: false,
            message: `Stok bahan ${mat ? mat.name : item.materialId} tidak cukup (butuh ${needed}, tersedia ${mat ? mat.stock : 0}).`
          };
        }
      }

      let materialCostTotal = 0;
      for (const item of recipe.items || []) {
        const mat = getMaterial(item.materialId);
        const needed = Number(item.qty) * count;
        mat.stock = Number(mat.stock) - needed;
        materialCostTotal += Number(mat.unitCost) * needed;
      }

      const elecTotal = Number(recipe.electricityCostPerUnit || 0) * count;
      const operTotal = Number(recipe.operationalCostPerUnit || 0) * count;
      const totalHpp = materialCostTotal + elecTotal + operTotal;

      addJournalEntry(`Produksi Manufaktur: ${recipe.name} (${count} ${recipe.outputUnit})`, [
        { account: "HPP Manufaktur", debit: totalHpp, credit: 0 },
        { account: "Persediaan Bahan Baku", debit: 0, credit: materialCostTotal },
        { account: "Beban Listrik & Operasional Mesin", debit: 0, credit: elecTotal + operTotal }
      ]);

      return {
        ok: true,
        recipe,
        count,
        materialCostTotal,
        elecTotal,
        operTotal,
        totalHpp,
        revenue: sellImmediately ? Number(salePricePerUnit ?? recipe.defaultPrice) * count : 0
      };
    }

    function bindTabEvents() {
      // POS events
      document.querySelectorAll("[data-add-product]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const prod = getMaterial(btn.getAttribute("data-add-product"));
          if (!prod) return;
          const existing = posCart.find((c) => c.type === "product" && c.id === prod.id);
          if (existing) {
            if (existing.qty + 1 > prod.stock) {
              showBanner("posFeedback", "Stok produk tidak mencukupi.", true);
              return;
            }
            existing.qty += 1;
          } else {
            if (Number(prod.stock) < 1) {
              showBanner("posFeedback", "Stok produk habis.", true);
              return;
            }
            posCart.push({
              type: "product",
              id: prod.id,
              name: prod.name,
              price: Number(prod.sellPrice),
              unitCost: Number(prod.unitCost),
              qty: 1
            });
          }
          renderMainView();
        });
      });

      const addBomCartBtn = document.getElementById("addBomToCartBtn");
      if (addBomCartBtn) {
        addBomCartBtn.addEventListener("click", () => {
          const recId = document.getElementById("posBomSelect").value;
          const qty = Number(document.getElementById("posBomQty").value || 1);
          const rec = db.bomRecipes.find((r) => r.id === recId);
          if (!rec || qty <= 0) return;
          posCart.push({
            type: "bom",
            id: rec.id,
            name: `${rec.name} (${qty} ${rec.outputUnit})`,
            price: Number(rec.defaultPrice),
            qty
          });
          renderMainView();
        });
      }

      document.querySelectorAll("[data-remove-cart]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const idx = Number(btn.getAttribute("data-remove-cart"));
          posCart.splice(idx, 1);
          renderMainView();
        });
      });

      const checkoutBtn = document.getElementById("checkoutPosBtn");
      if (checkoutBtn) {
        checkoutBtn.addEventListener("click", () => {
          if (posCart.length === 0) return;

          let totalRevenue = 0;
          let totalCogs = 0;
          let totalElec = 0;
          let totalOper = 0;

          // Validate product stock first
          for (const item of posCart) {
            if (item.type === "product") {
              const mat = getMaterial(item.id);
              if (!mat || Number(mat.stock) < item.qty) {
                showBanner("posFeedback", `Stok ${item.name} tidak mencukupi.`, true);
                return;
              }
            }
          }

          for (const item of posCart) {
            totalRevenue += item.price * item.qty;
            if (item.type === "product") {
              const mat = getMaterial(item.id);
              mat.stock = Number(mat.stock) - item.qty;
              totalCogs += Number(mat.unitCost) * item.qty;
            } else if (item.type === "bom") {
              const mfgRes = executeManufacturingProduction(item.id, item.qty, true, item.price);
              if (!mfgRes.ok) {
                db = loadDb();
                showBanner("posFeedback", mfgRes.message, true);
                return;
              }
              totalCogs += mfgRes.materialCostTotal;
              totalElec += mfgRes.elecTotal;
              totalOper += mfgRes.operTotal;
            }
          }

          const saleId = "INV-" + Date.now().toString().slice(-6);
          db.sales.unshift({
            id: saleId,
            date: nowDateStr(),
            cashierName: currentUser.name,
            items: [...posCart],
            total: totalRevenue,
            cogs: totalCogs,
            mfgElectricity: totalElec,
            mfgOperational: totalOper
          });

          addJournalEntry(`Penjualan Kasir ${saleId}`, [
            { account: "Kas / Piutang Penjualan", debit: totalRevenue, credit: 0 },
            { account: "Pendapatan Penjualan & Jasa", debit: 0, credit: totalRevenue },
            { account: "HPP Barang & Bahan Baku", debit: totalCogs, credit: 0 },
            { account: "Persediaan", debit: 0, credit: totalCogs }
          ]);

          saveDb(db);
          posCart = [];
          renderMainView();
          showBanner("posFeedback", `Transaksi ${saleId} berhasil diproses (${formatRupiah(totalRevenue)}).`);
        });
      }

      // Manufacturing events
      const runMfgForm = document.getElementById("runMfgForm");
      if (runMfgForm) {
        runMfgForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const recId = document.getElementById("mfgRecipeSelect").value;
          const qty = Number(document.getElementById("mfgQtyInput").value);
          const res = executeManufacturingProduction(recId, qty, false);
          if (!res.ok) {
            db = loadDb();
            showBanner("mfgFeedback", res.message, true);
            return;
          }
          saveDb(db);
          renderMainView();
          showBanner(
            "mfgFeedback",
            `Produksi ${res.count} ${res.recipe.outputUnit} (${res.recipe.name}) selesai. Bahan baku & biaya listrik/operasional telah dibebankan.`
          );
        });
      }

      const addBomRowBtn = document.getElementById("addBomRowBtn");
      if (addBomRowBtn) {
        addBomRowBtn.addEventListener("click", () => {
          draftBomItems.push({ materialId: db.materials[0].id, qty: 1 });
          renderMainView();
        });
      }

      document.querySelectorAll("[data-bom-mat]").forEach((sel) => {
        sel.addEventListener("change", () => {
          const i = Number(sel.getAttribute("data-bom-mat"));
          draftBomItems[i].materialId = sel.value;
        });
      });

      document.querySelectorAll("[data-bom-qty]").forEach((inp) => {
        inp.addEventListener("input", () => {
          const i = Number(inp.getAttribute("data-bom-qty"));
          draftBomItems[i].qty = Number(inp.value || 1);
        });
      });

      document.querySelectorAll("[data-bom-del]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = Number(btn.getAttribute("data-bom-del"));
          if (draftBomItems.length > 1) {
            draftBomItems.splice(i, 1);
            renderMainView();
          }
        });
      });

      const createBomForm = document.getElementById("createBomForm");
      if (createBomForm) {
        createBomForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("newBomName").value.trim();
          const outputUnit = document.getElementById("newBomUnit").value.trim() || "unit";
          const defaultPrice = Number(document.getElementById("newBomPrice").value || 0);
          const electricityCostPerUnit = Number(document.getElementById("newBomElec").value || 0);
          const operationalCostPerUnit = Number(document.getElementById("newBomOper").value || 0);

          if (!name) return;

          db.bomRecipes.push({
            id: "bom-" + Date.now(),
            name,
            outputUnit,
            defaultPrice,
            electricityCostPerUnit,
            operationalCostPerUnit,
            items: draftBomItems.map((x) => ({ materialId: x.materialId, qty: Number(x.qty || 1) }))
          });

          saveDb(db);
          draftBomItems = [{ materialId: db.materials[0].id, qty: 1 }];
          renderMainView();
          showBanner("mfgFeedback", `Resep BOM "${name}" berhasil disimpan.`);
        });
      }

      // Inventory restock
      const restockForm = document.getElementById("restockForm");
      if (restockForm) {
        restockForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const matId = document.getElementById("restockMatSelect").value;
          const qty = Number(document.getElementById("restockQty").value);
          const totalCost = Number(document.getElementById("restockCost").value);
          const mat = getMaterial(matId);
          if (!mat || qty <= 0) return;

          const oldStock = Number(mat.stock);
          const oldCostTotal = oldStock * Number(mat.unitCost);
          const newStock = oldStock + qty;
          mat.stock = newStock;
          if (newStock > 0) {
            mat.unitCost = Math.round((oldCostTotal + totalCost) / newStock);
          }

          addJournalEntry(`Restock / Kulakan ${mat.name} (+${qty} ${mat.unit})`, [
            { account: "Persediaan", debit: totalCost, credit: 0 },
            { account: "Kas / Hutang Kulakan", debit: 0, credit: totalCost }
          ]);

          saveDb(db);
          renderMainView();
          showBanner("invFeedback", `Restock ${mat.name} sebanyak ${qty} ${mat.unit} berhasil dicatat.`);
        });
      }

      // Accounting expense
      const expenseForm = document.getElementById("expenseForm");
      if (expenseForm) {
        expenseForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const category = document.getElementById("expenseCategory").value;
          const desc = document.getElementById("expenseDesc").value.trim();
          const amount = Number(document.getElementById("expenseAmount").value);
          if (!desc || amount <= 0) return;

          db.expenses.unshift({
            id: "exp-" + Date.now(),
            date: nowDateStr(),
            category,
            desc,
            amount
          });

          addJournalEntry(`${category}: ${desc}`, [
            { account: category, debit: amount, credit: 0 },
            { account: "Kas", debit: 0, credit: amount }
          ]);

          saveDb(db);
          renderMainView();
          showBanner("accFeedback", `Biaya "${desc}" sebesar ${formatRupiah(amount)} berhasil dicatat.`);
        });
      }

      // Accounts management (Owner)
      const addUserForm = document.getElementById("addUserForm");
      if (addUserForm) {
        addUserForm.addEventListener("submit", (e) => {
          e.preventDefault();
          const name = document.getElementById("newUserName").value.trim();
          const username = document.getElementById("newUserUsername").value.trim();
          const password = document.getElementById("newUserPassword").value;
          const role = document.getElementById("newUserRole").value;

          if (!name || !username || !password) return;
          if (db.users.some((u) => u.username.toLowerCase() === username.toLowerCase())) {
            showBanner("acctFeedback", "Username sudah digunakan.", true);
            return;
          }

          db.users.push({
            id: "u-" + Date.now(),
            name,
            username,
            password,
            role,
            active: true
          });

          saveDb(db);
          renderMainView();
          showBanner("acctFeedback", `Akun "${username}" (${role}) berhasil ditambahkan.`);
        });
      }

      document.querySelectorAll("[data-change-pwd]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const uid = btn.getAttribute("data-change-pwd");
          const input = document.getElementById("pwd-" + uid);
          const newPwd = input ? input.value : "";
          if (!newPwd) {
            showBanner("acctFeedback", "Masukkan kata sandi baru terlebih dahulu.", true);
            return;
          }
          const target = db.users.find((u) => u.id === uid);
          if (target) {
            target.password = newPwd;
            saveDb(db);
            renderMainView();
            showBanner("acctFeedback", `Kata sandi untuk ${target.username} berhasil diperbarui.`);
          }
        });
      });

      document.querySelectorAll("[data-del-user]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const uid = btn.getAttribute("data-del-user");
          db.users = db.users.filter((u) => u.id !== uid);
          saveDb(db);
          renderMainView();
          showBanner("acctFeedback", "Akun pengguna telah dihapus.");
        });
      });
    }
  </script>
</body>
</html>
